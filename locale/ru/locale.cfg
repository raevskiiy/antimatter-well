[entity-description]
antimatter-well=Единственный источник сырья. Поставьте на неё буровую головку, чтобы качать жидкую антиматерию.
antimatter-wellhead=Качает жидкую антиматерию из скважины. Работает на дереве и любом другом химическом топливе.
antimatter-wellhead-2=Более быстрая головка на электричестве.
antimatter-wellhead-3=Самая быстрая головка. Работает на электричестве.
matter-converter-burner=Превращает жидкую антиматерию в расплавленный металл, расплавленный камень, жидкий углерод, горячую воду и нефть. Работает на дереве и любом другом химическом топливе.
matter-converter=Более быстрый конвертер на электричестве.
matter-converter-2=Самый быстрый конвертер. Работает на электричестве.
matter-caster-burner=Отливает из расплава плиты и детали: плиты, сталь, шестерёнки, трубы, провода, кирпичи и другое. Работает на дереве и любом другом химическом топливе.
matter-caster=Более быстрая литейная на электричестве.
matter-caster-2=Самая быстрая литейная. Работает на электричестве.

isotope-separator=Заменяет центрифугу. Превращает жидкую антиматерию в уран-235 (редко) и уран-238, а также выполняет все остальные рецепты центрифуги.

