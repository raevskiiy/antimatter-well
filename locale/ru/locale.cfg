[technology-description]
antimatter-enrichment=Обогащает уран-238 до урана-235 жидкой антиматерией в изотопном сепараторе: из 100 урана-238 получается 10 урана-235. Также открывает ядерное топливо.
antimatter-electric=Электрическая буровая головка и конвертер материи.
antimatter-advanced=Продвинутая буровая головка и конвертер материи.

[mod-setting-name]
antimatter-uranium-235-chance=Шанс урана-235
antimatter-cost-multiplier=Множитель стоимости антиматерии
antimatter-keep-offshore-pump=Оставить рецепт оффшорного насоса
antimatter-remove-rocks=Убрать скалы (из них падают камень и уголь)

[mod-setting-description]
antimatter-uranium-235-chance=Шанс, что изотопный сепаратор выдаст уран-235 вместо урана-238 (ванильная центрифуга: 0.007 = 0.7%).
antimatter-cost-multiplier=Во сколько раз больше жидкой антиматерии нужно на каждый рецепт конвертации.
antimatter-keep-offshore-pump=По умолчанию вода берётся только из конвертеров материи.
antimatter-remove-rocks=Скалы дают камень и уголь в обход скважин.

[antimatter-well]
intro=Найдена скважина антиматерии: __1__. Поставьте на неё буровую головку, соедините трубами с конвертером (расплавленное железо / медь / камень, жидкий углерод, горячая вода), а расплав направьте трубами в литейную. Заправьте машины деревом и выберите рецепт в каждой.
