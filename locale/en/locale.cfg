[entity-description]
antimatter-well=The only source of raw materials. Place a wellhead on top of it to pump liquid antimatter.
antimatter-wellhead=Pumps liquid antimatter out of a well. Burns wood or any other chemical fuel.
antimatter-wellhead-2=Faster wellhead powered by electricity.
antimatter-wellhead-3=The fastest wellhead. Powered by electricity.
matter-converter-burner=Turns liquid antimatter into molten metal, molten stone, liquid carbon, hot water and crude oil. Burns wood or any other chemical fuel.
matter-converter=Faster converter powered by electricity.
matter-converter-2=The fastest converter. Powered by electricity.
matter-caster-burner=Casts molten material into plates and parts: plates, steel, gears, pipes, cables, bricks and more. Burns wood or any other chemical fuel.
matter-caster=Faster caster powered by electricity.
matter-caster-2=The fastest caster. Powered by electricity.

isotope-separator=Replaces the centrifuge. Turns liquid antimatter into uranium-235 (rare) and uranium-238, and runs all other centrifuge recipes.

