[mod-setting-description]
antimatter-uranium-235-chance=Chance that the isotope separator gives uranium-235 instead of uranium-238 (vanilla centrifuge: 0.007 = 0.7%).
antimatter-cost-multiplier=Multiplies the amount of liquid antimatter every conversion recipe needs.
antimatter-keep-offshore-pump=By default water comes only from matter converters.
antimatter-remove-rocks=Rocks would bypass the wells by giving stone and coal.

[antimatter-well]
intro=Antimatter well found: __1__. Place the wellhead on it, pipe it to a converter (molten iron / copper / stone, liquid carbon, hot water), then pipe the molten material into a caster. Fuel the machines with wood and choose a recipe in each.
